<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradiente de fondo del squircle protector -->
    <linearGradient id="bg" x1="60" y1="40" x2="450" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="50%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#0a0e16"/>
    </linearGradient>

    <!-- Borde sutil técnico -->
    <linearGradient id="borderGrad" x1="40" y1="40" x2="470" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#52c788" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Gradiente de la letra P principal de PunchiSoft -->
    <linearGradient id="pGrad" x1="120" y1="80" x2="400" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Gradiente del núcleo / prompt técnico -->
    <linearGradient id="accentCore" x1="230" y1="180" x2="300" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#52c788"/>
    </linearGradient>

    <!-- Sombra suave para relieve -->
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Carcasa exterior / Squircle protector -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="112" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Cuadrícula técnica sutil de fondo -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1.5">
    <line x1="128" y1="32" x2="128" y2="480"/>
    <line x1="256" y1="32" x2="256" y2="480"/>
    <line x1="384" y1="32" x2="384" y2="480"/>
    <line x1="32" y1="128" x2="480" y2="128"/>
    <line x1="32" y1="256" x2="480" y2="256"/>
    <line x1="32" y1="384" x2="480" y2="384"/>
  </g>

  <!-- Monograma P de PunchiSoft -->
  <g filter="url(#pGlow)">
    <!-- Letra P con fill-rule evenodd para recorte limpio del interior -->
    <path fill="url(#pGrad)" fill-rule="evenodd" d="
      M 136 112
      C 136 98.7, 146.7 88, 160 88
      L 290 88
      C 356.3 88, 410 141.7, 410 208
      C 410 274.3, 356.3 328, 290 328
      L 216 328
      L 216 400
      C 216 413.3, 205.3 424, 192 424
      L 160 424
      C 146.7 424, 136 413.3, 136 400
      Z
      M 216 160
      L 282 160
      C 308.5 160, 330 181.5, 330 208
      C 330 234.5, 308.5 256, 282 256
      L 216 256
      Z
    "/>

    <!-- Detalle de código / ingeniería en el núcleo: prompt >_ -->
    <path d="M 244 192 L 260 208 L 244 224" stroke="url(#accentCore)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="272" y1="224" x2="288" y2="224" stroke="url(#accentCore)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Nodo técnico sutil de equilibrio -->
  <circle cx="176" cy="376" r="6" fill="#38bdf8" opacity="0.85"/>
</svg>
