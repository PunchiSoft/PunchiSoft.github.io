<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <!-- Antena flexible de walkie-talkie -->
  <path d="M7.5 1.5v6" stroke-width="2"/>
  <!-- Perilla selectora de canales -->
  <path d="M15 4v3.5" stroke-width="2.2"/>
  <!-- Perilla de volumen / encendido -->
  <path d="M17.5 5v2.5" stroke-width="1.8"/>

  <!-- Carcasa principal reforzada de walkie-talkie portátil -->
  <rect x="5" y="7.5" width="13" height="15" rx="2.5" fill="rgba(88,166,255,0.1)"/>

  <!-- Botón PTT (Push-To-Talk) lateral izquierdo característico -->
  <path d="M3.2 10.5v4" stroke-width="2.4" stroke="var(--accent, #f97316)"/>

  <!-- Pantalla LCD de canal / frecuencia -->
  <rect x="7.5" y="10" width="8" height="3" rx="0.8" stroke-width="1.3"/>

  <!-- Rejilla de altavoz y micrófono frontal -->
  <line x1="8" y1="15.5" x2="15" y2="15.5" stroke-width="1.4"/>
  <line x1="8" y1="17.5" x2="15" y2="17.5" stroke-width="1.4"/>
  <line x1="9" y1="19.5" x2="14" y2="19.5" stroke-width="1.4"/>

  <!-- Ranuras antideslizantes laterales -->
  <line x1="19.2" y1="10" x2="19.2" y2="12" stroke-width="1.5"/>
  <line x1="19.2" y1="14" x2="19.2" y2="16" stroke-width="1.5"/>
</svg>
