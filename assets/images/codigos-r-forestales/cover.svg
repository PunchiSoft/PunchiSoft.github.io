<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <!-- Gradientes principales -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="60%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2536"/>
      <stop offset="100%" stop-color="#131a26"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(249,115,22,0.3)"/>
      <stop offset="100%" stop-color="rgba(56,189,248,0.05)"/>
    </linearGradient>

    <!-- Filtros de resplandor -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo base -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Cuadrícula técnica de fondo -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="675" fill="url(#grid)"/>
  </g>

  <!-- Silueta de cordillera y bosque forestal -->
  <path d="M 0 580 L 120 540 L 250 560 L 410 500 L 560 550 L 730 480 L 890 530 L 1050 490 L 1200 520 L 1200 675 L 0 675 Z" fill="#080c12" opacity="0.8"/>
  <!-- Pinos / Bosque silueta -->
  <g fill="#0c121c" opacity="0.9">
    <polygon points="180,590 195,540 210,590"/>
    <polygon points="198,590 210,545 222,590"/>
    <polygon points="340,580 355,520 370,580"/>
    <polygon points="360,585 372,530 384,585"/>
    <polygon points="620,570 635,510 650,570"/>
    <polygon points="810,560 825,505 840,560"/>
    <polygon points="980,575 995,515 1010,575"/>
    <polygon points="1000,580 1012,525 1024,580"/>
  </g>

  <!-- Torre de Telecomunicaciones Forestal en cumbre -->
  <g stroke="#f97316" stroke-width="2" opacity="0.85" filter="url(#glow)">
    <!-- Estructura celosía de torre -->
    <line x1="730" y1="480" x2="730" y2="280"/>
    <line x1="720" y1="480" x2="728" y2="280"/>
    <line x1="740" y1="480" x2="732" y2="280"/>
    <line x1="723" y1="440" x2="737" y2="440"/>
    <line x1="725" y1="390" x2="735" y2="390"/>
    <line x1="727" y1="340" x2="733" y2="340"/>
    <!-- Diagonales celosía -->
    <line x1="720" y1="480" x2="737" y2="440"/>
    <line x1="740" y1="480" x2="723" y2="440"/>
    <line x1="723" y1="440" x2="735" y2="390"/>
    <line x1="737" y1="440" x2="725" y2="390"/>
    <!-- Baliza y Antena repetidora -->
    <line x1="730" y1="280" x2="730" y2="230" stroke="#fb923c" stroke-width="3"/>
    <circle cx="730" cy="230" r="5" fill="#f97316"/>
    <!-- Ondas de radio concéntricas -->
    <circle cx="730" cy="230" r="25" stroke="rgba(249,115,22,0.6)" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
    <circle cx="730" cy="230" r="55" stroke="rgba(249,115,22,0.4)" stroke-width="1.5" fill="none" stroke-dasharray="6 4"/>
    <circle cx="730" cy="230" r="95" stroke="rgba(249,115,22,0.2)" stroke-width="1.5" fill="none" stroke-dasharray="8 6"/>
  </g>

  <!-- Tarjeta Transceptor Radio VHF Portátil (Centro Izquierda) -->
  <g transform="translate(140, 110)">
    <!-- Sombra posterior -->
    <rect x="-10" y="-10" width="360" height="460" rx="28" fill="rgba(0,0,0,0.6)"/>
    <rect x="0" y="0" width="340" height="440" rx="24" fill="url(#cardGrad)" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>

    <!-- Antena -->
    <rect x="75" y="-60" width="14" height="65" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="79" y="-95" width="6" height="40" rx="2" fill="#1e293b"/>
    <!-- Perilla Canal -->
    <rect x="230" y="-20" width="32" height="24" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <line x1="246" y1="-20" x2="246" y2="-8" stroke="#f97316" stroke-width="2"/>

    <!-- Carcasa superior del radio -->
    <rect x="24" y="24" width="292" height="60" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <!-- Indicador LED estado -->
    <circle cx="48" cy="54" r="6" fill="#22c55e" filter="url(#glow)"/>
    <text x="64" y="58" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12" font-weight="600">CANAL 01 · VHF CONAF/CORMA</text>

    <!-- Pantalla LCD Retroiluminada -->
    <rect x="24" y="100" width="292" height="110" rx="12" fill="#032030" stroke="#0284c7" stroke-width="1.5"/>
    <text x="44" y="132" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="1">RX/TX · 154.500 MHz</text>
    <text x="44" y="172" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="0.5">R-24 EN COMBATE</text>
    <text x="44" y="195" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">BRIGADA TERRESTRE · SECTOR SUR</text>

    <!-- Rejilla de altavoz -->
    <g stroke="#334155" stroke-width="3" stroke-linecap="round">
      <line x1="70" y1="240" x2="270" y2="240"/>
      <line x1="85" y1="256" x2="255" y2="256"/>
      <line x1="70" y1="272" x2="270" y2="272"/>
      <line x1="85" y1="288" x2="255" y2="288"/>
      <line x1="100" y1="304" x2="240" y2="304"/>
    </g>

    <!-- Teclado numérico / Códigos R -->
    <g transform="translate(45, 335)" fill="#1e293b" stroke="#334155" stroke-width="1">
      <rect x="0" y="0" width="70" height="34" rx="6"/>
      <text x="35" y="22" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">R-4</text>

      <rect x="90" y="0" width="70" height="34" rx="6"/>
      <text x="125" y="22" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">R-20</text>

      <rect x="180" y="0" width="70" height="34" rx="6" fill="rgba(249,115,22,0.2)" stroke="#f97316"/>
      <text x="215" y="22" fill="#f97316" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">R-83</text>

      <rect x="0" y="44" width="70" height="34" rx="6"/>
      <text x="35" y="66" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">R-25</text>

      <rect x="90" y="44" width="70" height="34" rx="6"/>
      <text x="125" y="66" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">R-34</text>

      <rect x="180" y="44" width="70" height="34" rx="6"/>
      <text x="215" y="66" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">R-99</text>
    </g>
  </g>

  <!-- Panel Informativo Lateral Derecho -->
  <g transform="translate(560, 130)">
    <!-- Badge de categoría -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="1.2"/>
    <circle cx="16" cy="17" r="4" fill="#f97316"/>
    <text x="30" y="22" fill="#fb923c" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CHILE · SECTOR FORESTAL</text>

    <!-- Título Principal -->
    <text x="0" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">CÓDIGOS R DE RADIO</text>
    <text x="0" y="130" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Protocolo Forestal e Incendios</text>

    <!-- Subtítulo / Descripción -->
    <text x="0" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="17" font-weight="400">
      <tspan x="0" dy="0">Guía de claves operativas y radiocomunicaciones de terreno</tspan>
      <tspan x="0" dy="26">utilizadas por CONAF, CORMA, faenas forestales y brigadas.</tspan>
    </text>

    <!-- Tarjetas de datos rápidos -->
    <g transform="translate(0, 230)">
      <!-- Tarjeta 1: Frecuencias -->
      <rect x="0" y="0" width="165" height="90" rx="14" fill="#131b28" stroke="#1e293b"/>
      <text x="18" y="30" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11" font-weight="600">ESPECTRO</text>
      <text x="18" y="58" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">VHF / UHF</text>
      <text x="18" y="76" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Repetidoras cumbre</text>

      <!-- Tarjeta 2: Claves -->
      <rect x="185" y="0" width="165" height="90" rx="14" fill="#131b28" stroke="#1e293b"/>
      <text x="203" y="30" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11" font-weight="600">CATÁLOGO</text>
      <text x="203" y="58" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">R-1 a R-99</text>
      <text x="203" y="76" fill="#f97316" font-family="system-ui, sans-serif" font-size="11">Claves estandarizadas</text>

      <!-- Tarjeta 3: Protocolo -->
      <rect x="370" y="0" width="165" height="90" rx="14" fill="#131b28" stroke="#1e293b"/>
      <text x="388" y="30" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11" font-weight="600">GESTIÓN</text>
      <text x="388" y="58" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">SCI / ICAO</text>
      <text x="388" y="76" fill="#22c55e" font-family="system-ui, sans-serif" font-size="11">Comando de incidentes</text>
    </g>

    <!-- Indicador de PunchiSoft -->
    <g transform="translate(0, 355)">
      <circle cx="10" cy="10" r="4" fill="#38bdf8"/>
      <text x="24" y="14" fill="#64748b" font-family="ui-monospace, monospace" font-size="12" font-weight="600">PUNCHISOFT · INGENIERÍA Y OPERACIONES INDUSTRIALES</text>
    </g>
  </g>
</svg>
