<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Portada de Noticias PunchiSoft del 17 de septiembre de 2026" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101720" />
      <stop offset="0.55" stop-color="#151b24" />
      <stop offset="1" stop-color="#1b2330" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" />
      <stop offset="1" stop-color="#52c788" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <circle cx="980" cy="120" r="220" fill="#58a6ff" opacity="0.10" />
  <circle cx="170" cy="600" r="180" fill="#52c788" opacity="0.08" />

  <g fill="none" stroke="#303b4d" stroke-width="1">
    <rect x="70" y="70" width="1060" height="535" rx="26" />
    <line x1="70" y1="150" x2="1130" y2="150" />
  </g>

  <g fill="#9aa8bb" font-family="monospace" font-size="20" letter-spacing="3">
    <text x="110" y="120">PUNCHISOFT</text>
    <text x="830" y="120">MUNDO LINUX</text>
  </g>

  <text x="110" y="300" fill="#f4f7fa" font-family="sans-serif" font-size="72" font-weight="700">Noticias PunchiSoft</text>
  <text x="110" y="380" fill="#58a6ff" font-family="sans-serif" font-size="42" font-weight="600">17 de septiembre de 2026</text>

  <rect x="110" y="430" width="420" height="6" rx="3" fill="url(#accent)" />

  <text x="110" y="512" fill="#9aa8bb" font-family="sans-serif" font-size="26">Kernel 7.2.6 · KDE Plasma 6.8 beta · Fedora Linux 45 beta</text>
  <text x="110" y="556" fill="#9aa8bb" font-family="sans-serif" font-size="26">Debian 13.7 «trixie» · ciclo Linux 7.3-rc3</text>
  <text x="110" y="592" fill="#6f7a87" font-family="monospace" font-size="19" letter-spacing="1">FUENTES OFICIALES · RESÚMENES ORIGINALES</text>
